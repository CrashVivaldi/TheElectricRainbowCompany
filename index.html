<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Electric Rainbow Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0A0714;
    --magenta: #FF2CD9;
    --cyan: #00E5FF;
    --gold: #FFCF56;
    --lilac: #E8DFFF;

    /* rainbow border-frame — also the source-of-truth hex for the five
       spectrum-color materials in materials.js (kept in sync by hand,
       CSS vars and the JS material registry don't share storage) */
    --c-red:    #FF0000;
    --c-yellow: #F5C518;
    --c-green:  #3DBF5F;
    --c-blue:   #2E86F5;
    --c-purple: #9B4FE0;

    /* Retuned: colored bands halved (0.7 -> 0.35), black separators
       thickened to compensate (0.805 -> 1.2425). 5*0.35 + 4*1.2425 =
       6.72vmin — byte-for-byte the same total width as before, which is
       not a coincidence and is not optional:
         sand-bg.js's rainbowFrameInsetPx() reconstructs the physics
       boundary as literally 5*band + 4*sep. It does not read
       --frame-inset and knows nothing about repetitions. Keeping that
       sum at 6.72vmin is what lets the whole multi-pass infinity mirror
       ship with ZERO changes to sand-bg.js — the floor drain, the DOM
       colliders, the palette groups and the contact link all still land
       exactly where they did.
         Change these two numbers freely, but change them TOGETHER so the
       sum holds, or the invisible physics edge drifts away from the
       visible one and sand starts piling against nothing. */
    --band: 0.35vmin;
    --sep:  1.2425vmin;
    --radius: 8vmin;
    --frame-inset: calc(5 * var(--band) + 4 * var(--sep));

    /* ---------- Infinity-mirror tilt (js/tilt.js) ----------
       tilt.js writes --tilt-x / --tilt-y every frame, both in [-1, 1],
       from the gyro on a phone or the pointer on desktop. Declared here
       with a 0 fallback so the border renders correctly at rest even if
       tilt.js fails to load, is blocked, or the visitor has reduced
       motion on — in every one of those cases every translate() below
       evaluates to 0 and the frame paints as a plain static border. */
    --tilt-x: 0;
    --tilt-y: 0;

    /* Maximum displacement of the DEEPEST ring at full tilt. Every other
       ring is a fraction of this, set per-element by frame.js. This is
       the single knob controlling how strong the effect reads — start
       here when tuning.
         NEGATIVE VALUES ARE VALID and flip the apparent depth direction:
       positive makes the rings recede INTO the screen (a well), negative
       makes them protrude OUT of it (a lens). Which reads as "correct"
       is genuinely ambiguous and a matter of taste — try both. */
    --tilt-depth: 10px;

    /* Extra per-ring dimming ON TOP OF the per-pass darkening frame.js
       already applies. Deliberately mild by default: PASS_DIM in
       frame.js does the heavy lifting of making each repetition read as
       further away, and this is only here to keep the gradient smooth
       WITHIN a pass rather than stepping at pass boundaries. 0 disables
       it. Applies only to colored rings, never separators. */
    --ring-fade: 0.15;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--void);
    overflow: hidden;
  }

  body {
    position: relative;
  }

  /* ---------- STACKING ORDER ----------
     Reordered so the sand simulation paints IN FRONT of the rainbow
     frame. This is what makes the extra infinity-mirror passes read as
     reflections sitting behind glass rather than as a merely thicker
     border — sand pours over the top of them.
       Note the consequence, since it is easy to miss: the deep passes
     extend inward past the physics boundary, so they occupy screen area
     the sand can actually fall through. That is the intended effect, not
     an overlap bug.
       The wordmark was lifted above the sim (was z-index 2) to keep it
     legible now that sand renders higher than it used to. If you would
     rather have sand bury the wordmark as it accumulates, set .stage
     back to 2 — that is the whole change, nothing else depends on it.

       0  (unused)          5  rainbow frame rings
       8  sand sim          9  wordmark
      10  carry overlay    11  carry glow
      12  contact link     13  material palette                        */

  /* ---------- The sim, full screen ---------- */
  /* Fixed, cropped viewport wrapper — #box is sized in JS (sand-bg.js's
     resizeBox) to "cover" the window at the sim's real 150:192 pixel
     aspect ratio, so it fills edge to edge without distorting the
     pixel art. This wrapper just crops whatever overflows. */
  #stageWrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 8;
  }

  #box {
    position: fixed;
    top: 0;
    left: 0;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Every canvas render.js draws to — same sizing/position convention
     the real game uses (see sandbox.html's #box canvas rule): absolute,
     inset 0, 100% of the sized box, nearest-neighbor scaling so native
     low-res pixels stay crisp/chunky. */
  #box canvas {
    display: block;
    position: absolute;
    image-rendering: pixelated;
  }

  #glow      { filter: blur(5px)  saturate(1.6) brightness(130%); mix-blend-mode: screen; opacity: .95; pointer-events: none; }
  #blobglow, #laserglow { mix-blend-mode: screen; opacity: .95; pointer-events: none; }
  #vecOverlay { pointer-events: none; }

  /* ---------- Rainbow border frame ----------
     Concentric rings, red outside -> black separator -> yellow -> black
     -> green -> black -> blue -> black -> purple inside, that whole
     sequence repeated PASSES times (js/frame.js), each repetition
     thinner and darker than the last.

     THE RING ELEMENTS ARE GENERATED, NOT AUTHORED. This used to be nine
     hand-written divs with nine hand-written CSS rules. At twenty-seven
     that stops being maintainable, and the count is a tuning constant
     that should be changeable without editing markup — so .rainbow-frame
     ships empty and frame.js fills it, setting each ring's inset,
     border-radius, thickness, color and depth fraction inline. What
     stays here is only what is genuinely shared across every ring.

     WHY NOT box-shadow ON ONE ELEMENT, as this used to be: a box-shadow
     is not an element, so individual rings cannot be transformed
     independently, and the entire infinity-mirror effect is built out of
     moving each ring by a different amount. */
  .ring {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    will-change: transform;
    transform: translate(
      calc(var(--tilt-x) * var(--tilt-depth) * var(--d)),
      calc(var(--tilt-y) * var(--tilt-depth) * var(--d))
    );
  }

  /* Colored rings take the extra within-pass dimming. The black
     separators deliberately do not: they are structural — they are what
     makes each colored band read as a distinct ring rather than a
     gradient — and a dimmer black is just black. */
  .ring-color { opacity: calc(1 - var(--ring-fade) * var(--d)); }

  /* frame.js already sets every --d, and tilt.js pins --tilt-x/--tilt-y
     to 0 and never starts its frame loop under reduced motion, so this
     is belt-and-braces for the case where those vars get driven by
     something else later. Costs nothing. */
  @media (prefers-reduced-motion: reduce) {
    .ring { transform: none !important; }
  }

  /* ---------- Carry-preview overlay ----------
     Standalone canvas, deliberately OUTSIDE #box and #box's own five-
     canvas render.js stack — the carried clump is a tiny (<=~radius-6
     disc worth of cells) site-only interaction concern with nothing to
     do with the sim's own render pipeline, and keeping it fully separate
     means it can't accidentally interact with dirty-rects/shimmer/glow
     or any future render.js change. Sized to the raw viewport in
     sand-bg.js (not VIEW_W*CELL_PX like #box's canvases), since it draws
     in plain screen space via the same world->screen math worldRectToScreen
     already uses, not the sim's internal cell grid. */
  #carryOverlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    image-rendering: pixelated;
  }

  /* ---------- Carry-glow overlay ----------
     A picked-up blob was rendering flat with no glow at all — carrying
     lifts material clear off the grid (see beginCarry, sand-bg.js), and
     the grid is the only thing render.js's real #glow layer ever draws
     from. This is the exact same base+glow duplicate-canvas trick
     render.js already uses three times over (#glow, #blobglow,
     #laserglow): sand-bg.js's drawCarryPreview() draws the identical
     solid rects into THIS canvas too, and the blur/saturate/brightness
     filter + screen blend below does the actual glow. Default filter
     values match #glow's own defaults; sand-bg.js's applyGlowFilter()
     keeps both in sync with the tuning panel's glow sliders afterward,
     so a carried blob reads as the same material mid-air, not a
     differently-tuned one. */
  #carryGlow {
    position: fixed;
    inset: 0;
    z-index: 11;
    pointer-events: none;
    image-rendering: pixelated;
    filter: blur(5px) saturate(1.6) brightness(130%);
    mix-blend-mode: screen;
    opacity: .95;
  }

  /* ---------- Wordmark, floating above the sim ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 6vw;
    pointer-events: none;
  }

  h1 {
    margin: 0;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Monoton', cursive;
    font-weight: 500;
    font-size: clamp(1.5rem, 6.4vw, 3.6rem);
    line-height: 1.2;
    letter-spacing: 0.01em;
    background: linear-gradient(100deg, var(--magenta), var(--cyan), var(--gold), var(--magenta));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 10s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(255, 44, 217, 0.35);
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none !important; }
  }

  @media (orientation: landscape) {
    h1 {
      font-size: clamp(1rem, 4.29vw, 2.41rem);
    }
    .contact-link {
      font-size: clamp(0.6rem, 2.15vw, 1.07rem);
    }
  }

  /* ---------- Contact link ---------- */
  .contact-link {
    position: fixed;
    top: calc(var(--frame-inset) + 10px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 12;
    font-family: 'Monoton', cursive;
    font-weight: 500;
    font-size: clamp(0.9rem, 3.2vw, 1.6rem);
    letter-spacing: 0.01em;
    text-decoration: none;
    background: linear-gradient(100deg, var(--magenta), var(--cyan), var(--gold), var(--magenta));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 10s ease-in-out infinite;
    pointer-events: auto;
  }
  .contact-link:hover { filter: brightness(1.15); }

  @media (prefers-reduced-motion: reduce) {
    .contact-link { animation: none !important; }
  }

  /* ---------- Page nav ----------
     Same simple two-link pattern on both pages, not a shared component
     yet — two links isn't worth a module. If a third experiment shows
     up, THIS is the point to build the real "opening UI"/switcher
     instead of copy-pasting a third link. */
  .page-nav {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 12;
    font: 12px/1.4 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
  .page-nav a {
    color: var(--lilac);
    text-decoration: none;
    opacity: 0.7;
    border-bottom: 1px solid rgba(232,223,255,0.3);
    padding-bottom: 1px;
  }
  .page-nav a:hover { opacity: 1; }

  /* ---------- Material palette (sand-bg.js) ----------
     Three groups inset inside the rainbow frame's inner purple edge.
     Kept at the top of the stack so the swatches stay clickable now that
     the sim paints above the frame. */
  .palette-group {
    position: fixed;
    z-index: 13;
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  .palette-sands {
    top: calc(var(--frame-inset) + 10px);
    left: calc(var(--frame-inset) + 10px);
    flex-direction: column;
  }
  .palette-liquids {
    top: calc(var(--frame-inset) + 10px);
    right: calc(var(--frame-inset) + 10px);
    flex-direction: column;
  }
  .palette-gases {
    bottom: calc(var(--frame-inset) + 10px);
    left: 50%;
    transform: translateX(-50%);
    flex-direction: row;
  }
  .palette-swatch {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    cursor: pointer;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
    pointer-events: auto;
    transition: box-shadow 0.12s;
  }
</style>
</head>
<body>

  <div id="stageWrap">
    <div id="box">
      <canvas id="base"></canvas>
      <canvas id="glow"></canvas>
      <canvas id="blobglow"></canvas>
      <canvas id="laserglow"></canvas>
      <canvas id="vecOverlay"></canvas>
    </div>
  </div>

  <div class="stage">
    <h1>
      <span class="solid-collider">The</span>
      <span class="title-subline">
        <span class="solid-collider">Electric</span> <span class="solid-collider">Rainbow</span> <span class="solid-collider">Company</span>
      </span>
    </h1>
  </div>

  <!-- Intentionally empty: js/frame.js populates this with the full ring
       stack at load. The wrapper itself paints nothing and keeps the
       .rainbow-frame class so anything that ever queried for it still
       finds a node in the same place in the document. -->
  <div class="rainbow-frame"></div>

  <a class="contact-link" href="mailto:theelectricrainbowcompany@proton.me">contact</a>

  <canvas id="carryOverlay"></canvas>
  <canvas id="carryGlow"></canvas>

  <!-- Both plain classic scripts, not modules: neither has imports,
       nothing imports them, and they communicate with the page through
       CSS custom properties and the DOM rather than through exports.
       Order matters only in that frame.js reads --band/--sep/--radius
       and the ring colors off :root, which are static and already
       parsed by the time either runs. -->
  <script src="./js/tilt.js"></script>
  <script src="./js/frame.js"></script>
  <script type="module" src="./js/sand-bg.js"></script>

</body>
</html>
