<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Electric Rainbow Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0A0714;
    --magenta: #FF2CD9;
    --cyan: #00E5FF;
    --gold: #FFCF56;
    --lilac: #E8DFFF;

    /* rainbow border-frame — also the source-of-truth hex for the five
       spectrum-color materials in materials.js (kept in sync by hand,
       CSS vars and the JS material registry don't share storage) */
    --c-red:    #FF0000;
    --c-yellow: #F5C518;
    --c-green:  #3DBF5F;
    --c-blue:   #2E86F5;
    --c-purple: #9B4FE0;
    --band: 0.4vmin;
    --sep:  1.18vmin;
    --outer-border: 2px;
    --radius: 8vmin;
    --frame-inset: calc(5 * var(--band) + 4 * var(--sep));

    /* Border glow — box-shadow blur only (no filter; iOS-safe).
       Strength ~30% between the intense and minimal presets. */
    --glow-tight: 0.3vmin;
    --glow-mid: 0.8vmin;
    --glow-wide: 0.9vmin;
    --glow-r:  rgba(255, 0, 0, 0.51);
    --glow-rm: rgba(255, 0, 0, 0.31);
    --glow-rf: rgba(255, 0, 0, 0.12);
    --glow-y:  rgba(245, 197, 24, 0.48);
    --glow-ym: rgba(245, 197, 24, 0.29);
    --glow-yf: rgba(245, 197, 24, 0.12);
    --glow-g:  rgba(61, 191, 95, 0.47);
    --glow-gm: rgba(61, 191, 95, 0.29);
    --glow-gf: rgba(61, 191, 95, 0.12);
    --glow-b:  rgba(46, 134, 245, 0.47);
    --glow-bm: rgba(46, 134, 245, 0.29);
    --glow-bf: rgba(46, 134, 245, 0.12);
    --glow-p:  rgba(155, 79, 224, 0.48);
    --glow-pm: rgba(155, 79, 224, 0.29);
    --glow-pf: rgba(155, 79, 224, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--void);
    overflow: hidden;
  }

  body {
    position: relative;
  }

  /* ---------- The sim, full screen ---------- */
  /* Fixed, cropped viewport wrapper — #box is sized in JS (sand-bg.js's
     resizeBox) to "cover" the window at the sim's real 150:192 pixel
     aspect ratio, so it fills edge to edge without distorting the
     pixel art. This wrapper just crops whatever overflows. */
  #stageWrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  #box {
    position: fixed;
    top: 0;
    left: 0;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Every canvas render.js draws to — same sizing/position convention
     the real game uses (see sandbox.html's #box canvas rule): absolute,
     inset 0, 100% of the sized box, nearest-neighbor scaling so native
     low-res pixels stay crisp/chunky. */
  #box canvas {
    display: block;
    position: absolute;
    image-rendering: pixelated;
  }

  #glow      { filter: blur(5px)  saturate(1.6) brightness(130%); mix-blend-mode: screen; opacity: .95; pointer-events: none; }
  #blobglow, #laserglow { mix-blend-mode: screen; opacity: .95; pointer-events: none; }
  #vecOverlay { pointer-events: none; }

  /* ---------- Rainbow border frame ----------
     Concentric square rings via stacked inset box-shadow: red outside
     -> black separator -> yellow -> black -> green -> black -> blue ->
     black -> purple inside. A 2px black strip fills the gap below the
     frame (::after, fixed to the viewport bottom) so the outer red band
     is not covered or clipped at the screen edge. Subtle bloom via
     ::before box-shadow blur (no CSS filter — iOS-safe). Rings are
     are fully calc()-driven off --band/--sep/--radius. */
  .rainbow-frame {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: var(--outer-border);
    pointer-events: none;
    z-index: 5;
    border-radius: var(--radius);
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    box-shadow:
      inset 0 0 0 var(--band) var(--c-red),
      inset 0 0 0 calc(var(--band) + var(--sep)) black,
      inset 0 0 0 calc(var(--band)*2 + var(--sep)) var(--c-yellow),
      inset 0 0 0 calc(var(--band)*2 + var(--sep)*2) black,
      inset 0 0 0 calc(var(--band)*3 + var(--sep)*2) var(--c-green),
      inset 0 0 0 calc(var(--band)*3 + var(--sep)*3) black,
      inset 0 0 0 calc(var(--band)*4 + var(--sep)*3) var(--c-blue),
      inset 0 0 0 calc(var(--band)*4 + var(--sep)*4) black,
      inset 0 0 0 calc(var(--band)*5 + var(--sep)*4) var(--c-purple);
  }

  .rainbow-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow:
      /* outer — three tiers per color at ~30% of full intensity */
      0 0 var(--glow-tight) 1px var(--glow-r),
      0 0 var(--glow-mid) 2px var(--glow-rm),
      0 0 var(--glow-wide) 2px var(--glow-rf),
      0 0 var(--glow-tight) 1px var(--glow-y),
      0 0 var(--glow-mid) 2px var(--glow-ym),
      0 0 var(--glow-wide) 2px var(--glow-yf),
      0 0 var(--glow-tight) 1px var(--glow-g),
      0 0 var(--glow-mid) 2px var(--glow-gm),
      0 0 var(--glow-wide) 2px var(--glow-gf),
      0 0 var(--glow-tight) 1px var(--glow-b),
      0 0 var(--glow-mid) 2px var(--glow-bm),
      0 0 var(--glow-wide) 2px var(--glow-bf),
      0 0 var(--glow-tight) 1px var(--glow-p),
      0 0 var(--glow-mid) 2px var(--glow-pm),
      0 0 var(--glow-wide) 2px var(--glow-pf),
      /* ring-traced inset bloom — red, yellow, green, purple */
      inset 0 0 var(--glow-tight) var(--band) var(--glow-r),
      inset 0 0 var(--glow-mid) calc(var(--band)*2 + var(--sep)) var(--glow-ym),
      inset 0 0 var(--glow-mid) calc(var(--band)*3 + var(--sep)*2) var(--glow-gm),
      inset 0 0 var(--glow-wide) calc(var(--band)*5 + var(--sep)*4) var(--glow-pm);
  }

  .rainbow-frame::after {
    content: "";
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--outer-border);
    background: black;
    pointer-events: none;
    z-index: 5;
  }

  /* ---------- Carry-preview overlay ----------
     Standalone canvas, deliberately OUTSIDE #box and #box's own five-
     canvas render.js stack — the carried clump is a tiny (<=~radius-6
     disc worth of cells) site-only interaction concern with nothing to
     do with the sim's own render pipeline, and keeping it fully separate
     means it can't accidentally interact with dirty-rects/shimmer/glow
     or any future render.js change. Sized to the raw viewport in
     sand-bg.js (not VIEW_W*CELL_PX like #box's canvases), since it draws
     in plain screen space via the same world->screen math worldRectToScreen
     already uses, not the sim's internal cell grid. */
  #carryOverlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    image-rendering: pixelated;
  }

  /* ---------- Carry-glow overlay ----------
     A picked-up blob was rendering flat with no glow at all — carrying
     lifts material clear off the grid (see beginCarry, sand-bg.js), and
     the grid is the only thing render.js's real #glow layer ever draws
     from. This is the exact same base+glow duplicate-canvas trick
     render.js already uses three times over (#glow, #blobglow,
     #laserglow): sand-bg.js's drawCarryPreview() draws the identical
     solid rects into THIS canvas too, and the blur/saturate/brightness
     filter + screen blend below does the actual glow. Default filter
     values match #glow's own defaults; sand-bg.js's applyGlowFilter()
     keeps both in sync with the tuning panel's glow sliders afterward,
     so a carried blob reads as the same material mid-air, not a
     differently-tuned one. */
  #carryGlow {
    position: fixed;
    inset: 0;
    z-index: 7;
    pointer-events: none;
    image-rendering: pixelated;
    filter: blur(5px) saturate(1.6) brightness(130%);
    mix-blend-mode: screen;
    opacity: .95;
  }

  /* ---------- Wordmark, floating above the sim ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 6vw;
    pointer-events: none;
  }

  h1 {
    margin: 0;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Monoton', cursive;
    font-weight: 500;
    font-size: clamp(1.5rem, 6.4vw, 3.6rem);
    line-height: 1.2;
    letter-spacing: 0.01em;
    background: linear-gradient(100deg, var(--magenta), var(--cyan), var(--gold), var(--magenta));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 10s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(255, 44, 217, 0.35);
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none !important; }
  }

  @media (orientation: landscape) {
    h1 {
      font-size: clamp(1rem, 4.29vw, 2.41rem);
    }
    .contact-link {
      font-size: clamp(0.6rem, 2.15vw, 1.07rem);
    }
  }

  /* ---------- Contact link ---------- */
  .contact-link {
    position: fixed;
    top: calc(var(--frame-inset) + 10px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 12;
    font-family: 'Monoton', cursive;
    font-weight: 500;
    font-size: clamp(0.9rem, 3.2vw, 1.6rem);
    letter-spacing: 0.01em;
    text-decoration: none;
    background: linear-gradient(100deg, var(--magenta), var(--cyan), var(--gold), var(--magenta));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 10s ease-in-out infinite;
    pointer-events: auto;
  }
  .contact-link:hover { filter: brightness(1.15); }

  @media (prefers-reduced-motion: reduce) {
    .contact-link { animation: none !important; }
  }

  /* ---------- Page nav ----------
     Same simple two-link pattern on both pages, not a shared component
     yet — two links isn't worth a module. If a third experiment shows
     up, THIS is the point to build the real "opening UI"/switcher
     instead of copy-pasting a third link. */
  .page-nav {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 12;
    font: 12px/1.4 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
  .page-nav a {
    color: var(--lilac);
    text-decoration: none;
    opacity: 0.7;
    border-bottom: 1px solid rgba(232,223,255,0.3);
    padding-bottom: 1px;
  }
  .page-nav a:hover { opacity: 1; }

  /* ---------- Material palette (sand-bg.js) ----------
     Three groups inset inside the rainbow frame's inner purple edge. */
  .palette-group {
    position: fixed;
    z-index: 10;
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  .palette-sands {
    top: calc(var(--frame-inset) + 10px);
    left: calc(var(--frame-inset) + 10px);
    flex-direction: column;
  }
  .palette-liquids {
    top: calc(var(--frame-inset) + 10px);
    right: calc(var(--frame-inset) + 10px);
    flex-direction: column;
  }
  .palette-gases {
    bottom: calc(var(--outer-border) + var(--frame-inset) + 10px);
    left: 50%;
    transform: translateX(-50%);
    flex-direction: row;
  }
  .palette-swatch {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    cursor: pointer;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
    pointer-events: auto;
    transition: box-shadow 0.12s;
  }
</style>
</head>
<body>

  <div id="stageWrap">
    <div id="box">
      <canvas id="base"></canvas>
      <canvas id="glow"></canvas>
      <canvas id="blobglow"></canvas>
      <canvas id="laserglow"></canvas>
      <canvas id="vecOverlay"></canvas>
    </div>
  </div>

  <div class="stage">
    <h1>
      <span class="solid-collider">The</span>
      <span class="title-subline">
        <span class="solid-collider">Electric</span> <span class="solid-collider">Rainbow</span> <span class="solid-collider">Company</span>
      </span>
    </h1>
  </div>

  <div class="rainbow-frame"></div>

  <a class="contact-link" href="mailto:TheElectricRainbowCompany@proton.me">contact</a>

  <canvas id="carryOverlay"></canvas>
  <canvas id="carryGlow"></canvas>

  <script type="module" src="./js/sand-bg.js"></script>

</body>
</html>
