<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Electric Rainbow Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0A0714;
    --magenta: #FF2CD9;
    --cyan: #00E5FF;
    --gold: #FFCF56;
    --lilac: #E8DFFF;

    /* rainbow border-frame — also the source-of-truth hex for the five
       spectrum-color materials in materials.js (kept in sync by hand,
       CSS vars and the JS material registry don't share storage) */
    --c-red:    #FF0000;
    --c-yellow: #F5C518;
    --c-green:  #3DBF5F;
    --c-blue:   #2E86F5;
    --c-purple: #9B4FE0;
    --band: 0.7vmin;
    --sep:  0.805vmin;
    --radius: 8vmin;
    --frame-inset: calc(5 * var(--band) + 4 * var(--sep));

    /* ---------- Infinity-mirror tilt (js/tilt.js) ----------
       tilt.js writes --tilt-x / --tilt-y every frame, both in [-1, 1],
       from the gyro on a phone or the pointer on desktop. Declared here
       with a 0 fallback so the border renders correctly at rest even if
       tilt.js fails to load, is blocked, or the visitor has reduced
       motion on — in every one of those cases every translate() below
       evaluates to 0 and the frame is pixel-identical to the old
       single-element version. */
    --tilt-x: 0;
    --tilt-y: 0;

    /* Maximum displacement of the DEEPEST (innermost, purple) ring at
       full tilt. Every other ring is a fraction of this, per --ring-N-d
       below. This is the single knob that controls how strong the whole
       effect reads — start here when tuning.
         NEGATIVE VALUES ARE VALID and flip the apparent depth direction:
       positive makes the rings read as receding INTO the screen (a well),
       negative makes them read as protruding OUT of it (a lens). Which
       one "looks right" is genuinely a matter of taste and of which way
       your brain resolves the ambiguity, so try both before deciding. */
    --tilt-depth: 10px;

    /* How much the deepest ring dims relative to the outermost, mimicking
       a real infinity mirror losing energy on each bounce. 0 disables the
       fade entirely and restores the exact current on-screen appearance
       of the border at rest. Applied only to the COLORED rings — see the
       note in the ring block below for why the black separators are
       deliberately left opaque. */
    --ring-fade: 0.22;

    /* Per-ring depth fraction, 0 (outermost, pinned) to 1 (innermost,
       moves the full --tilt-depth). Deliberately NOT linear: the spacing
       accelerates inward, which is what makes the rings read as a
       receding corridor rather than a stack of cards sliding past each
       other at even intervals. Real reflections in an infinity mirror
       compress toward the vanishing point; even spacing looks like a
       parallax effect, uneven spacing looks like depth.
         The outermost ring is pinned at exactly 0 on purpose. It is the
       physical bezel of the frame, and it is also flush with the screen
       edge — displacing it at all would swing it off the viewport and
       open a sliver of bare --void along one side on every tilt. */
    --ring-0-d: 0;
    --ring-1-d: 0.02;
    --ring-2-d: 0.06;
    --ring-3-d: 0.12;
    --ring-4-d: 0.20;
    --ring-5-d: 0.32;
    --ring-6-d: 0.48;
    --ring-7-d: 0.70;
    --ring-8-d: 1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--void);
    overflow: hidden;
  }

  body {
    position: relative;
  }

  /* ---------- The sim, full screen ---------- */
  /* Fixed, cropped viewport wrapper — #box is sized in JS (sand-bg.js's
     resizeBox) to "cover" the window at the sim's real 150:192 pixel
     aspect ratio, so it fills edge to edge without distorting the
     pixel art. This wrapper just crops whatever overflows. */
  #stageWrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  #box {
    position: fixed;
    top: 0;
    left: 0;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Every canvas render.js draws to — same sizing/position convention
     the real game uses (see sandbox.html's #box canvas rule): absolute,
     inset 0, 100% of the sized box, nearest-neighbor scaling so native
     low-res pixels stay crisp/chunky. */
  #box canvas {
    display: block;
    position: absolute;
    image-rendering: pixelated;
  }

  #glow      { filter: blur(5px)  saturate(1.6) brightness(130%); mix-blend-mode: screen; opacity: .95; pointer-events: none; }
  #blobglow, #laserglow { mix-blend-mode: screen; opacity: .95; pointer-events: none; }
  #vecOverlay { pointer-events: none; }

  /* ---------- Rainbow border frame ----------
     Concentric rings, red outside -> black separator -> yellow -> black
     -> green -> black -> blue -> black -> purple inside. Same colors,
     same thicknesses, same corner treatment as always.

     WHY NINE ELEMENTS INSTEAD OF ONE: this used to be a single fixed div
     carrying nine stacked inset box-shadows of monotonically increasing
     spread. That is a genuinely tidier way to paint a static frame, and
     it is the version that shipped for months. It has exactly one
     limitation, and it turned out to be the one that mattered: a
     box-shadow is not an element, so individual rings cannot be
     transformed independently. The infinity-mirror effect is entirely
     built out of moving each ring by a different amount, so the shadows
     had to become real elements. If the tilt effect is ever removed,
     collapsing this back into the old single-element rule is a clean
     revert — nothing else in the codebase depends on the split.

     WHAT HAD TO BE RECOMPUTED BY HAND: the old version got concentric
     corners for free, because box-shadow spread on a rounded rect
     automatically shrinks the inner radius as it moves inward. Nine
     separate elements get no such favor, so each ring's radius is
     explicitly its own inset subtracted from the outer --radius. That
     keeps every corner truly concentric instead of nine identical
     rounded rects nested inside each other, which reads as visibly wrong
     at the corners even though the straight edges look fine. This is the
     detail most likely to drift if --band/--sep/--radius are retuned —
     the offsets below are all calc()-derived, so they follow
     automatically, but it is worth an eyeball at the corners after any
     change to those three variables.
       One bound worth knowing: at the current values the innermost ring's
     radius works out to 1.28vmin, comfortably positive. If --radius is
     ever reduced below the total frame inset (6.72vmin), inner radii go
     negative and the browser silently clamps them to 0, squaring off the
     inner corners while the outer ones stay round.

     PHYSICS/LAYOUT CONTRACT UNCHANGED: sand-bg.js's rainbowFrameInsetPx()
     (colliders, floor-drain padding) and --frame-inset (palette and
     contact-link positioning) both derive from --band/--sep, which are
     untouched. The nine ring insets sum to exactly 5*band + 4*sep, which
     is --frame-inset itself, so the invisible physics boundary and the
     visible inner edge still agree to the pixel. Only the painting
     changed, not the geometry.

     NOTE ON THE TILT TRANSFORMS: translate() on a position:fixed element
     moves it in real screen pixels, independent of the vmin-based sizing
     — which is what we want here. --tilt-depth is therefore an absolute
     px value and does not scale with viewport size the way the ring
     thicknesses do. That is deliberate: the effect should feel like the
     same physical amount of movement on a phone and on a desktop
     monitor, not proportionally larger on a big screen. */
  .ring {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    will-change: transform;
  }

  /* Colored rings dim with depth. The black separators deliberately do
     NOT: they are structural, not reflective — they are what makes each
     colored band read as a distinct ring rather than a gradient. Fading
     them toward transparent would let the sand sim show through the gaps
     and muddy the whole frame, which is the opposite of the crisp
     concentric look the border exists for. Dark stays dark at depth
     anyway, so there is nothing physical being fudged here. */
  .ring-color { opacity: calc(1 - var(--ring-fade) * var(--d)); }

  .ring-0 {
    --d: var(--ring-0-d);
    inset: 0;
    border-radius: var(--radius);
    box-shadow: inset 0 0 0 var(--band) var(--c-red);
  }
  .ring-1 {
    --d: var(--ring-1-d);
    inset: var(--band);
    border-radius: calc(var(--radius) - var(--band));
    box-shadow: inset 0 0 0 var(--sep) black;
  }
  .ring-2 {
    --d: var(--ring-2-d);
    inset: calc(var(--band) + var(--sep));
    border-radius: calc(var(--radius) - var(--band) - var(--sep));
    box-shadow: inset 0 0 0 var(--band) var(--c-yellow);
  }
  .ring-3 {
    --d: var(--ring-3-d);
    inset: calc(var(--band)*2 + var(--sep));
    border-radius: calc(var(--radius) - var(--band)*2 - var(--sep));
    box-shadow: inset 0 0 0 var(--sep) black;
  }
  .ring-4 {
    --d: var(--ring-4-d);
    inset: calc(var(--band)*2 + var(--sep)*2);
    border-radius: calc(var(--radius) - var(--band)*2 - var(--sep)*2);
    box-shadow: inset 0 0 0 var(--band) var(--c-green);
  }
  .ring-5 {
    --d: var(--ring-5-d);
    inset: calc(var(--band)*3 + var(--sep)*2);
    border-radius: calc(var(--radius) - var(--band)*3 - var(--sep)*2);
    box-shadow: inset 0 0 0 var(--sep) black;
  }
  .ring-6 {
    --d: var(--ring-6-d);
    inset: calc(var(--band)*3 + var(--sep)*3);
    border-radius: calc(var(--radius) - var(--band)*3 - var(--sep)*3);
    box-shadow: inset 0 0 0 var(--band) var(--c-blue);
  }
  .ring-7 {
    --d: var(--ring-7-d);
    inset: calc(var(--band)*4 + var(--sep)*3);
    border-radius: calc(var(--radius) - var(--band)*4 - var(--sep)*3);
    box-shadow: inset 0 0 0 var(--sep) black;
  }
  .ring-8 {
    --d: var(--ring-8-d);
    inset: calc(var(--band)*4 + var(--sep)*4);
    border-radius: calc(var(--radius) - var(--band)*4 - var(--sep)*4);
    box-shadow: inset 0 0 0 var(--band) var(--c-purple);
  }

  /* One rule drives all nine. Each ring reads its own --d, set in its
     own class above, so the displacement math lives in exactly one
     place rather than being repeated nine times with nine chances to
     typo a multiplier. */
  .ring {
    transform: translate(
      calc(var(--tilt-x) * var(--tilt-depth) * var(--d)),
      calc(var(--tilt-y) * var(--tilt-depth) * var(--d))
    );
  }

  /* tilt.js already pins --tilt-x/--tilt-y to 0 and never starts its
     animation frame loop under reduced motion, so this is belt-and-
     braces for the case where the vars are being driven by something
     else, or a future consumer sets them directly. Costs nothing. */
  @media (prefers-reduced-motion: reduce) {
    .ring { transform: none !important; }
  }

  /* ---------- Carry-preview overlay ----------
     Standalone canvas, deliberately OUTSIDE #box and #box's own five-
     canvas render.js stack — the carried clump is a tiny (<=~radius-6
     disc worth of cells) site-only interaction concern with nothing to
     do with the sim's own render pipeline, and keeping it fully separate
     means it can't accidentally interact with dirty-rects/shimmer/glow
     or any future render.js change. Sized to the raw viewport in
     sand-bg.js (not VIEW_W*CELL_PX like #box's canvases), since it draws
     in plain screen space via the same world->screen math worldRectToScreen
     already uses, not the sim's internal cell grid. */
  #carryOverlay {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    image-rendering: pixelated;
  }

  /* ---------- Carry-glow overlay ----------
     A picked-up blob was rendering flat with no glow at all — carrying
     lifts material clear off the grid (see beginCarry, sand-bg.js), and
     the grid is the only thing render.js's real #glow layer ever draws
     from. This is the exact same base+glow duplicate-canvas trick
     render.js already uses three times over (#glow, #blobglow,
     #laserglow): sand-bg.js's drawCarryPreview() draws the identical
     solid rects into THIS canvas too, and the blur/saturate/brightness
     filter + screen blend below does the actual glow. Default filter
     values match #glow's own defaults; sand-bg.js's applyGlowFilter()
     keeps both in sync with the tuning panel's glow sliders afterward,
     so a carried blob reads as the same material mid-air, not a
     differently-tuned one. */
  #carryGlow {
    position: fixed;
    inset: 0;
    z-index: 7;
    pointer-events: none;
    image-rendering: pixelated;
    filter: blur(5px) saturate(1.6) brightness(130%);
    mix-blend-mode: screen;
    opacity: .95;
  }

  /* ---------- Wordmark, floating above the sim ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 6vw;
    pointer-events: none;
  }

  h1 {
    margin: 0;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Monoton', cursive;
    font-weight: 500;
    font-size: clamp(1.5rem, 6.4vw, 3.6rem);
    line-height: 1.2;
    letter-spacing: 0.01em;
    background: linear-gradient(100deg, var(--magenta), var(--cyan), var(--gold), var(--magenta));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 10s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(255, 44, 217, 0.35);
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none !important; }
  }

  @media (orientation: landscape) {
    h1 {
      font-size: clamp(1rem, 4.29vw, 2.41rem);
    }
    .contact-link {
      font-size: clamp(0.6rem, 2.15vw, 1.07rem);
    }
  }

  /* ---------- Contact link ---------- */
  .contact-link {
    position: fixed;
    top: calc(var(--frame-inset) + 10px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 12;
    font-family: 'Monoton', cursive;
    font-weight: 500;
    font-size: clamp(0.9rem, 3.2vw, 1.6rem);
    letter-spacing: 0.01em;
    text-decoration: none;
    background: linear-gradient(100deg, var(--magenta), var(--cyan), var(--gold), var(--magenta));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 10s ease-in-out infinite;
    pointer-events: auto;
  }
  .contact-link:hover { filter: brightness(1.15); }

  @media (prefers-reduced-motion: reduce) {
    .contact-link { animation: none !important; }
  }

  /* ---------- Page nav ----------
     Same simple two-link pattern on both pages, not a shared component
     yet — two links isn't worth a module. If a third experiment shows
     up, THIS is the point to build the real "opening UI"/switcher
     instead of copy-pasting a third link. */
  .page-nav {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 12;
    font: 12px/1.4 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
  .page-nav a {
    color: var(--lilac);
    text-decoration: none;
    opacity: 0.7;
    border-bottom: 1px solid rgba(232,223,255,0.3);
    padding-bottom: 1px;
  }
  .page-nav a:hover { opacity: 1; }

  /* ---------- Material palette (sand-bg.js) ----------
     Three groups inset inside the rainbow frame's inner purple edge. */
  .palette-group {
    position: fixed;
    z-index: 10;
    display: flex;
    gap: 8px;
    pointer-events: none;
  }
  .palette-sands {
    top: calc(var(--frame-inset) + 10px);
    left: calc(var(--frame-inset) + 10px);
    flex-direction: column;
  }
  .palette-liquids {
    top: calc(var(--frame-inset) + 10px);
    right: calc(var(--frame-inset) + 10px);
    flex-direction: column;
  }
  .palette-gases {
    bottom: calc(var(--frame-inset) + 10px);
    left: 50%;
    transform: translateX(-50%);
    flex-direction: row;
  }
  .palette-swatch {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    cursor: pointer;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
    pointer-events: auto;
    transition: box-shadow 0.12s;
  }
</style>
</head>
<body>

  <div id="stageWrap">
    <div id="box">
      <canvas id="base"></canvas>
      <canvas id="glow"></canvas>
      <canvas id="blobglow"></canvas>
      <canvas id="laserglow"></canvas>
      <canvas id="vecOverlay"></canvas>
    </div>
  </div>

  <div class="stage">
    <h1>
      <span class="solid-collider">The</span>
      <span class="title-subline">
        <span class="solid-collider">Electric</span> <span class="solid-collider">Rainbow</span> <span class="solid-collider">Company</span>
      </span>
    </h1>
  </div>

  <!-- Rainbow frame: one element per ring, outermost first. The wrapper
       carries the old .rainbow-frame class so anything that ever queried
       for it still finds a node in the same place in the stacking order,
       but it paints nothing itself — every visible pixel comes from the
       nine .ring children. -->
  <div class="rainbow-frame">
    <div class="ring ring-color ring-0"></div>
    <div class="ring ring-1"></div>
    <div class="ring ring-color ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ring ring-color ring-4"></div>
    <div class="ring ring-5"></div>
    <div class="ring ring-color ring-6"></div>
    <div class="ring ring-7"></div>
    <div class="ring ring-color ring-8"></div>
  </div>

  <a class="contact-link" href="mailto:theelectricrainbowcompany@proton.me">contact</a>

  <canvas id="carryOverlay"></canvas>
  <canvas id="carryGlow"></canvas>

  <!-- Plain classic script, not a module: it has no imports, nothing
       imports it, and it publishes its output as CSS custom properties
       rather than as an export. Loading it before sand-bg.js means the
       tilt vars are already live by the time the sim starts painting,
       though nothing actually breaks if it loads late — the vars have
       0 fallbacks declared in :root. -->
  <script src="./js/tilt.js"></script>
  <script type="module" src="./js/sand-bg.js"></script>

</body>
</html>
