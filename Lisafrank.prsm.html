<script>
// Shared WebGL shader source — vertex + fragment — used by both the
// photo-parallax.html studio (live editing) and prismatic.js (the
// <prismatic-card> viewer rendered from exported .prsm manifests).
// Single source of truth: edit here, both consumers pick it up.
(function (global) {
  const VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  vUv.y = 1.0 - vUv.y;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

  const FS = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uPhoto;
uniform sampler2D uDepth;
uniform vec2 uTilt;
uniform float uStrength;
uniform float uFocus;
uniform float uEdge;
uniform float uBlur;
uniform float uSoftBlur;
uniform float uInvert;
uniform float uShowDepth;
uniform vec2 uTexel;
uniform float uBrightness;
uniform float uSaturation;
uniform float uTintHue;
uniform float uTintAmount;
uniform float uPhotoFoil;
uniform float uFoilOpacity;
uniform float uFoilSparkle;
uniform float uFoilScale;
uniform float uFoilMono;
uniform float uFoilVintage;
uniform float uFoilHue;
uniform float uFoilGrainAmt;
uniform float uEmbossStrength;
uniform float uChromAb;
uniform float uVignette;
uniform float uGrain;
uniform float uTime;
uniform float uPhotoOpacity;
uniform float uFacetType;
uniform vec2 uCoverScale;

float sampleDepth(vec2 uv) {
  float d = texture2D(uDepth, clamp(uv, 0.0, 1.0)).r;
  return mix(d, 1.0 - d, uInvert);
}

vec3 hsv2rgb(vec3 c) {
  vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return c.z * mix(vec3(1.0), rgb, c.y);
}

vec3 softLight(vec3 base, vec3 blend) {
  return mix(
    2.0 * base * blend + base * base * (1.0 - 2.0 * blend),
    sqrt(base) * (2.0 * blend - 1.0) + 2.0 * base * (1.0 - blend),
    step(0.5, blend)
  );
}

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

void main() {
  // stretch-to-fit vs crop-to-fill: transform screen-space vUv into
  // photo-space uv. When stretchToFit is on, uCoverScale is (1,1) and this
  // is a no-op — matches the original always-stretch behavior exactly.
  vec2 pUv = 0.5 + (vUv - 0.5) * uCoverScale;

  float d = sampleDepth(pUv);
  if (uShowDepth > 0.5) {
    gl_FragColor = vec4(vec3(d), 1.0);
    return;
  }

  vec2 disp = uTilt * (d - uFocus) * uStrength;
  vec2 uv = pUv + disp;

  // soft edge: pull samples back toward the frame so holes are less obvious
  vec2 edgeUv = abs(uv - 0.5) * 2.0;
  float edgeAmt = max(edgeUv.x, edgeUv.y);
  float edgeFade = smoothstep(1.0 - uEdge * 0.35, 1.0 + uEdge * 0.15, edgeAmt);
  uv = mix(uv, clamp(uv, 0.002, 0.998), edgeFade);

  // cheap depth-of-field: blend neighboring samples when far from focus
  float coc = abs(d - uFocus) * uBlur;
  vec3 col = texture2D(uPhoto, clamp(uv, 0.0, 1.0)).rgb;
  if (uSoftBlur > 0.001) {
    vec2 o = uTexel * (1.0 + uSoftBlur * 10.0);
    vec3 soft =
      texture2D(uPhoto, clamp(uv + vec2( o.x, 0.0), 0.0, 1.0)).rgb +
      texture2D(uPhoto, clamp(uv + vec2(-o.x, 0.0), 0.0, 1.0)).rgb +
      texture2D(uPhoto, clamp(uv + vec2(0.0,  o.y), 0.0, 1.0)).rgb +
      texture2D(uPhoto, clamp(uv + vec2(0.0, -o.y), 0.0, 1.0)).rgb;
    col = mix(col, soft * 0.25, uSoftBlur);
  }
  if (coc > 0.01) {
    vec2 o = uTexel * (1.0 + coc * 8.0);
    vec3 blur =
      texture2D(uPhoto, clamp(uv + vec2( o.x, 0.0), 0.0, 1.0)).rgb +
      texture2D(uPhoto, clamp(uv + vec2(-o.x, 0.0), 0.0, 1.0)).rgb +
      texture2D(uPhoto, clamp(uv + vec2(0.0,  o.y), 0.0, 1.0)).rgb +
      texture2D(uPhoto, clamp(uv + vec2(0.0, -o.y), 0.0, 1.0)).rgb;
    col = mix(col, blur * 0.25, clamp(coc * 1.8, 0.0, 0.85));
  }

  // chromatic aberration: R/B channels sampled with a tilt-scaled offset —
  // reinforces the parallax direction as an actual lens cue instead of a
  // pure flat-color shift.
  if (uChromAb > 0.001) {
    vec2 caOffset = uTilt * uChromAb * uTexel * 30.0;
    float rC = texture2D(uPhoto, clamp(uv + caOffset, 0.0, 1.0)).r;
    float bC = texture2D(uPhoto, clamp(uv - caOffset, 0.0, 1.0)).b;
    col.r = mix(col.r, rC, 0.85);
    col.b = mix(col.b, bC, 0.85);
  }

  // brightness / saturation / tint
  col *= uBrightness;
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(luma), col, uSaturation);
  if (uTintAmount > 0.001) {
    vec3 tint = hsv2rgb(vec3(uTintHue / 360.0, 0.65, 1.0));
    col = mix(col, col * tint, uTintAmount);
  }

  // transparent holographic film over the photograph
  if (uPhotoFoil > 0.5 && uFoilOpacity > 0.001) {
    float scale = max(4.0, uFoilScale);
    vec2 p = uv * scale + uTilt * 1.8;

    vec2 g, f;
    if (uFacetType < 0.5) {
      // diamond (original): square grid, quadrant split
      g = floor(p);
      f = fract(p) - 0.5;
    } else if (uFacetType < 1.5) {
      // hex: two offset square lattices, nearest wins — standard robust
      // technique for hex tiling without a dedicated hex-distance function
      vec2 s = vec2(1.0, 1.7320508);
      vec2 a = mod(p, s) - s * 0.5;
      vec2 b = mod(p - s * 0.5, s) - s * 0.5;
      bool useA = dot(a, a) < dot(b, b);
      f = useA ? a : b;
      g = useA ? floor(p / s) : floor((p - s * 0.5) / s) + vec2(0.5);
    } else if (uFacetType < 2.5) {
      // prism: sheared strips
      vec2 pp = vec2(p.x - p.y * 0.6, p.y);
      g = floor(pp);
      f = fract(pp) - 0.5;
    } else {
      // flecks: jittered nearest-point search — irregular shard look
      // without literal polygon fills (not possible per-fragment)
      vec2 baseCell = floor(p);
      float minD = 10.0;
      g = baseCell;
      f = vec2(0.0);
      for (int yy = -1; yy <= 1; yy++) {
        for (int xx = -1; xx <= 1; xx++) {
          vec2 c = baseCell + vec2(float(xx), float(yy));
          vec2 jitter = vec2(hash21(c), hash21(c + vec2(11.0, 7.0))) - 0.5;
          vec2 pt = c + 0.5 + jitter * 0.7;
          float dd = distance(p, pt);
          if (dd < minD) { minD = dd; g = c; f = p - pt; }
        }
      }
    }

    float qi = step(0.0, f.x) + step(0.0, f.y) * 2.0;
    vec2 face = sign(f + 1e-4);
    float facing = 0.35
      + (1.0 - min(1.0, length(f) * 2.4)) * 0.9
      + dot(face, uTilt) * 0.35
      + (d - 0.5) * 0.15;
    facing = clamp(facing, 0.0, 1.4);
    float spark = pow(clamp(facing, 0.0, 1.0), 3.0) * uFoilSparkle;
    float hue = fract(
      (g.x + g.y) * 0.07 + qi * 0.08
      + uv.x * 0.45 + uv.y * 0.28
      + uTilt.x * 0.22 - uTilt.y * 0.18
    );
    float sat = mix(0.18, 0.95, clamp(spark * 1.35, 0.0, 1.0));
    float lit = mix(0.4, 0.95, clamp(spark, 0.0, 1.0));

    if (uFoilMono > 0.5) {
      // Flat single-hue foil, no hue-cycling across the surface — reads as
      // an old laser-etched security-sticker hologram (fixed green/silver
      // tint, brightness-only sparkle) instead of a diffraction grating.
      // Grain is baked per-facet (not tilt-dependent) so it reads as a
      // physical texture on the material rather than a flicker.
      hue = fract(uFoilHue);
      sat = mix(0.08, 0.5, clamp(spark * 1.2, 0.0, 1.0));
      float grainN = hash21(g * 3.1 + qi * 7.0) - 0.5;
      lit = clamp(lit + grainN * uFoilGrainAmt * 0.4, 0.0, 1.0);

      // vintage embossed relief — normal-from-depth, lit against tilt
      if (uFoilVintage > 0.5 && uEmbossStrength > 0.001) {
        vec2 embossStep = uTexel * 14.0;
        float dL = sampleDepth(pUv - vec2(embossStep.x, 0.0));
        float dR = sampleDepth(pUv + vec2(embossStep.x, 0.0));
        float dT = sampleDepth(pUv - vec2(0.0, embossStep.y));
        float dB = sampleDepth(pUv + vec2(0.0, embossStep.y));
        vec3 normal = normalize(vec3((dL - dR) * uEmbossStrength, (dT - dB) * uEmbossStrength, 1.0));
        vec3 lightDir = normalize(vec3(uTilt.x * 0.85, -uTilt.y * 0.85, 0.7));
        float relief = clamp(dot(normal, lightDir) * 0.5 + 0.5, 0.0, 1.0);
        lit *= mix(0.72, 1.38, relief);
        lit = clamp(lit, 0.0, 1.0);
      }
    }

    vec3 foil = hsv2rgb(vec3(hue, sat, lit));
    float alpha = uFoilOpacity * mix(0.1, 1.0, clamp(spark, 0.0, 1.0));
    // soft-light keeps the photo readable underneath
    col = mix(col, softLight(col, foil), alpha);
    // tiny specular kick so it reads as film, not a tint
    col += foil * (spark * uFoilOpacity * 0.18);
  }

  // vignette the well slightly so foil border reads (fixed, always on)
  float vig = smoothstep(1.15, 0.55, length((vUv - 0.5) * vec2(1.05, 1.2)));
  col *= mix(0.88, 1.0, vig);

  // user-controllable vignette, on top of the fixed one above
  if (uVignette > 0.001) {
    float vigUser = smoothstep(1.2, 0.25, length((vUv - 0.5) * vec2(1.0, 1.15)));
    col *= mix(1.0, vigUser, uVignette);
  }

  // film grain: animated so it flickers like real photographic grain

    const doc = new DOMParser().parseFromString(html, 'text/html');
    const manifestEl = doc.getElementById('prsm-manifest');
    if (!manifestEl) throw new Error(`${src}: no #prsm-manifest found`);
    return JSON.parse(manifestEl.textContent);
  }

  async _readManifestAndStart() {
    const src = this.getAttribute('src');
    let manifest;
    if (src) {
      try {
        manifest = await this._readExternalManifest(src);
      } catch (err) {
        this.emptyEl.textContent = `Could not load ${src}`;
        console.warn(err);
        return;
      }
    } else {
      // data-manifest lets multiple cards share a page, each pointing at its
      // own manifest tag; falls back to the original fixed id so every
      // already-exported single-card .prsm file keeps working unchanged.
      const manifestId = this.getAttribute('data-manifest') || 'prsm-manifest';
      const manifestEl = document.getElementById(manifestId);
      if (!manifestEl) {
        this.emptyEl.textContent = `Missing #${manifestId}`;
        return;
      }
      try {
        manifest = JSON.parse(manifestEl.textContent);
      } catch (err) {
        this.emptyEl.textContent = 'Invalid manifest JSON';
        console.warn(err);
        return;
      }
    }

    this.params = manifestToParams(manifest);
    this.cardEl.style.setProperty('--rot-amt', this.params.rotAmt + 'deg');

    if (manifest.type === 'diorama') {
      const layers = (manifest.diorama?.layers || []).map((l) => ({
        src: l.src,
        depth: typeof l.depth === 'number' ? l.depth : 0,
        opacity: typeof l.opacity === 'number' ? l.opacity : 1,
      }));
      const { composite, depth, hasAny } = await buildDioramaComposite(layers);
      if (hasAny) {
        await this._setPhotoFromCanvas(composite, depth);
      } else if (manifest.photo?.src) {
        await this._loadPhoto(manifest.photo.src, manifest.photo.depth);
      }
    } else if (manifest.photo?.src) {
      await this._loadPhoto(manifest.photo.src, manifest.photo.depth);
    }

    this.resize();
    // guard against a second overlapping rAF loop if a src change re-runs
    // this after the loop from a previous load is already ticking
    if (!this._loopStarted) {
      this._loopStarted = true;
      this.animationLoop();
    }
    this._setupGyroPrompt();
  }

  _setupInput() {
    this.stage.addEventListener('pointermove', this._onPointerMove);
    this.stage.addEventListener('pointerleave', this._onPointerLeave);
    this.stage.addEventListener('touchmove', this._onTouchMove, { passive: false });
    this.stage.addEventListener('touchend', this._onTouchEnd);
    this.enableTiltBtn.addEventListener('click', () => this._requestGyro());
  }

  _setupGyroPrompt() {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      this.tiltOverlay.classList.add('show');
    } else if (DOE) {
      window.addEventListener('deviceorientation', this._boundOrientation);
    }
  }

  async _requestGyro() {
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return;
    if (typeof DOE.requestPermission === 'function') {
      try {
        const result = await DOE.requestPermission();
        if (result === 'granted') {
          window.addEventListener('deviceorientation', this._boundOrientation);
          this.tiltOverlay.classList.remove('show');
        }
      } catch (err) {
        console.warn('tilt permission blocked', err);
      }
    } else {
      window.addEventListener('deviceorientation', this._boundOrientation);
      this.tiltOverlay.classList.remove('show');
    }
  }

  handleOrientation(e) {
    if (e.gamma === null || e.beta === null) return;
    if (!this.baseline) this.baseline = { beta: e.beta, gamma: e.gamma };
    const scale = 30 / this.params.gyroSens;
    const gx = (e.gamma - this.baseline.gamma) / scale * (this.params.invertGyroX ? -1 : 1);
    const gy = (e.beta - this.baseline.beta) / scale * (this.params.invertGyroY ? -1 : 1);
    this.setTarget(gx, gy);
    if (!this.usingGyro) {
      this.usingGyro = true;
      this.tiltOverlay.classList.remove('show');
    }
  }

  animationLoop() {
    if (this.reducedMotion) {
      this.tilt.x = this.target.x;
      this.tilt.y = this.target.y;
    } else {
      this.tilt.x += (this.target.x - this.tilt.x) * 0.14;
      this.tilt.y += (this.target.y - this.tilt.y) * 0.14;
    }

    this.cardEl.style.setProperty('--tx', this.tilt.x.toFixed(3));
    this.cardEl.style.setProperty('--ty', this.tilt.y.toFixed(3));

    if (this.hasPhoto && this.params) {
      this.resize();
      let hx = this.tilt.x;
      let hy = this.tilt.y;
      if (this.params.wrapTilt) {
        hx = Math.sin(this.tilt.x * Math.PI);
        hy = Math.sin(this.tilt.y * Math.PI);
      }

      const gl = this.gl;
      const uni = this.uni;
      gl.useProgram(this.prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.photoTex);
      gl.uniform1i(uni.uPhoto, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, this.depthTex);
      gl.uniform1i(uni.uDepth, 1);
      gl.uniform2f(uni.uTilt, hx, -hy);
      gl.uniform1f(uni.uStrength, this.params.strength);
      gl.uniform1f(uni.uFocus, this.params.focus);
      gl.uniform1f(uni.uEdge, this.params.edge);
      gl.uniform1f(uni.uBlur, this.params.blur);
      gl.uniform1f(uni.uSoftBlur, this.params.softBlur ?? 0);
      gl.uniform1f(uni.uInvert, this.params.invertDepth ? 1 : 0);
      gl.uniform1f(uni.uShowDepth, 0);
      gl.uniform2f(uni.uTexel, 1 / Math.max(1, this.photoSize.w), 1 / Math.max(1, this.photoSize.h));
      gl.uniform1f(uni.uBrightness, this.params.brightness);
      gl.uniform1f(uni.uSaturation, this.params.saturation);
      gl.uniform1f(uni.uTintHue, this.params.tintHue);
      gl.uniform1f(uni.uTintAmount, this.params.tintAmount);
      gl.uniform1f(uni.uPhotoFoil, this.params.photoFoil ? 1 : 0);
      gl.uniform1f(uni.uFoilOpacity, this.params.foilOpacity);
      gl.uniform1f(uni.uFoilSparkle, this.params.foilSparkle);
      gl.uniform1f(uni.uFoilScale, mix(28, 10, (this.params.foilSize - 10) / 18));
      const foilStyle = this.params.foilStyle;
      gl.uniform1f(uni.uFoilMono, (foilStyle === 'mono' || foilStyle === 'vintage') ? 1 : 0);
      gl.uniform1f(uni.uFoilVintage, foilStyle === 'vintage' ? 1 : 0);
      gl.uniform1f(uni.uFoilHue, this.params.foilHue / 360);
      gl.uniform1f(uni.uFoilGrainAmt, this.params.foilGrain);
      gl.uniform1f(uni.uEmbossStrength, foilStyle === 'vintage' ? (this.params.foilEmbossStrength ?? 0.4) : 0);
      gl.uniform1f(uni.uChromAb, this.params.chromAb);
      gl.uniform1f(uni.uVignette, this.params.vignette);
      gl.uniform1f(uni.uGrain, this.params.grain);
      gl.uniform1f(uni.uTime, performance.now() / 1000);
      gl.uniform1f(uni.uPhotoOpacity, this.params.photoOpacity);
      const facetIndex = { diamond: 0, hex: 1, prism: 2, flecks: 3 }[this.params.facetType] ?? 0;
      gl.uniform1f(uni.uFacetType, facetIndex);
      const cover = this.computeCoverScale();
      gl.uniform2f(uni.uCoverScale, cover[0], cover[1]);
      gl.drawArrays(gl.TRIANGLES, 0, 6);

      this.drawBorderFoil(this.tilt.x, this.tilt.y);
    }

    this._raf = requestAnimationFrame(() => this.animationLoop());
  }

  _teardown() {
    if (this._raf) cancelAnimationFrame(this._raf);
    this._loopStarted = false;
    window.removeEventListener('resize', this._boundResize);
    window.removeEventListener('deviceorientation', this._boundOrientation);
    if (this.stage) {
      this.stage.removeEventListener('pointermove', this._onPointerMove);
      this.stage.removeEventListener('pointerleave', this._onPointerLeave);
      this.stage.removeEventListener('touchmove', this._onTouchMove);
      this.stage.removeEventListener('touchend', this._onTouchEnd);
    }
  }
}

if (!customElements.get('prismatic-card')) {
  customElements.define('prismatic-card', PrismaticCard);
}

})();

</script></body>
</html>
