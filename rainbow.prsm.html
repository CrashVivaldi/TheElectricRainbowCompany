uniform float uEdge;
uniform float uBlur;
uniform float uInvert;

uniform float uBrightness;
uniform float uSaturation;

uniform float uTintAmount;

uniform float uFoilOpacity;

uniform float uFoilScale;

uniform float uFoilHue;

    2.0 * base * blend + base * base * (1.0 - 2.0 * blend),

    } else if (uFacetType < 2.5) {

      vec2 pp = vec2(p.x - p.y * 0.6, p.y);

      // without literal polygon fills (not possible per-fragment)

    .map((l, i) => ({ img: l.img ?? l.src ?? null, depth: l.depth, opacity: l.opacity, i }))

      uFoilOpacity: gl.getUniformLocation(prog, 'uFoilOpacity'),
      uFoilSparkle: gl.getUniformLocation(prog, 'uFoilSparkle'),
      uFoilScale: gl.getUniformLocation(prog, 'uFoilScale'),
      uFoilMono: gl.getUniformLocation(prog, 'uFoilMono'),
      uFoilHue: gl.getUniformLocation(prog, 'uFoilHue'),
      uFoilGrainAmt: gl.getUniformLocation(prog, 'uFoilGrainAmt'),
      uChromAb: gl.getUniformLocation(prog, 'uChromAb'),
      uVignette: gl.getUniformLocation(prog, 'uVignette'),
      uGrain: gl.getUniformLocation(prog, 'uGrain'),
      uTime: gl.getUniformLocation(prog, 'uTime'),
      uPhotoOpacity: gl.getUniformLocation(prog, 'uPhotoOpacity'),
      uFacetType: gl.getUniformLocation(prog, 'uFacetType'),
      uCoverScale: gl.getUniformLocation(prog, 'uCoverScale'),
    };

    this.photoTex = gl.createTexture();
    this.depthTex = gl.createTexture();
    this.setupTex(this.photoTex);
    this.setupTex(this.depthTex);
    const px = new Uint8Array([128, 128, 128, 255]);
    gl.bindTexture(gl.TEXTURE_2D, this.depthTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
  }

  setupTex(tex) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  uploadImageToTex(tex, source) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, 0);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  }

  computeCoverScale() {
    if (this.params.stretchToFit) return [1, 1];
    const canvasAspect = this.glCanvas.width / Math.max(1, this.glCanvas.height);
    const photoAspect = this.photoSize.w / Math.max(1, this.photoSize.h);
    if (photoAspect > canvasAspect) return [canvasAspect / photoAspect, 1];
    return [1, photoAspect / canvasAspect];
  }

  resize() {
    const rect = this.glCanvas.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(rect.width * this.dpr));
    const h = Math.max(1, Math.floor(rect.height * this.dpr));
    if (this.glCanvas.width !== w || this.glCanvas.height !== h) {
      this.glCanvas.width = w;
      this.glCanvas.height = h;
      this.foilCanvas.width = w;
      this.foilCanvas.height = h;
      this.gl.viewport(0, 0, w, h);
    }
  }

  setTarget(x, y) {
    this.target.x = clamp(x, -1, 1);
    this.target.y = clamp(y, -1, 1);
  }

  tiltFromClient(clientX, clientY) {
    const rect = this.stage.getBoundingClientRect();
    this.setTarget(
      ((clientX - rect.left) / rect.width - 0.5) * 2,
      ((clientY - rect.top) / rect.height - 0.5) * 2
    );
  }

  drawBorderFoil(tx, ty) {
    const params = this.params;
    const foilCtx = this.foilCtx;
    const foilCanvas = this.foilCanvas;
    const w = foilCanvas.width;
    const h = foilCanvas.height;
    foilCtx.clearRect(0, 0, w, h);
    if (!params.borderFoil || !this.hasPhoto) return;

    const insetX = w * 0.07;
    const insetY = h * 0.065;
    const well = { x: insetX, y: insetY, w: w - insetX * 2, h: h - insetY * 2 };

    foilCtx.save();
    foilCtx.beginPath();
    foilCtx.rect(0, 0, w, h);
    foilCtx.rect(well.x, well.y, well.w, well.h);
    foilCtx.clip('evenodd');

    foilCtx.fillStyle = '#2a2e33';
    foilCtx.fillRect(0, 0, w, h);

    let hotX = 0.5 - tx * 0.42;
    let hotY = 0.5 - ty * 0.42;
    if (params.wrapTilt) {
      hotX = fract(hotX);
      hotY = fract(hotY);
    } else {
      hotX = clamp(hotX, 0.02, 0.98);
      hotY = clamp(hotY, 0.02, 0.98);
    }

    const cell = params.borderSize * this.dpr;
    const half = cell * 0.5;
    const cols = Math.ceil(w / cell) + 3;
    const rows = Math.ceil(h / half) + 3;

    for (let row = -1; row < rows; row++) {
      for (let col = -1; col < cols; col++) {
        const cx = (col + ((row & 1) ? 0.5 : 0)) * cell;
        const cy = row * half;
        if (cx < -cell || cy < -cell || cx > w + cell || cy > h + cell) continue;
        if (cx > well.x && cx < well.x + well.w && cy > well.y && cy < well.y + well.h) continue;

        const nx = cx / w;
        const ny = cy / h;
        const verts = [
          [cx, cy - half], [cx + half, cy], [cx, cy + half], [cx - half, cy],
        ];
        for (let i = 0; i < 4; i++) {
          const faceBiasX = (i === 1 ? 0.55 : i === 3 ? -0.55 : 0);
          const faceBiasY = (i === 0 ? -0.55 : i === 2 ? 0.55 : 0);
          let dx = nx - hotX - faceBiasX * 0.08;
          let dy = ny - hotY - faceBiasY * 0.08;
          if (params.wrapTilt) {
            dx = wrapDelta(nx, hotX);
            dy = wrapDelta(ny, hotY);
          }
          const align = 1 - Math.min(1, Math.hypot(dx, dy) * 2.2);
          const facing = clamp(0.35 + align * 0.9, 0, 1.3);
          const hue = (nx * 160 + ny * 90) + tx * 70 + ty * -50 + i * 24;
          const spark = Math.pow(clamp(facing, 0, 1), 3) * params.borderSparkle;
          const sat = mix(14, 95, clamp(spark * 1.3, 0, 1));
          const lit = mix(48, 90, clamp(spark, 0, 1));
          foilCtx.beginPath();
          foilCtx.moveTo(verts[i][0], verts[i][1]);
          foilCtx.lineTo(verts[(i + 1) % 4][0], verts[(i + 1) % 4][1]);
          foilCtx.lineTo(cx, cy);
          foilCtx.closePath();
          foilCtx.fillStyle = hsl(hue, sat, lit);
          foilCtx.fill();
        }
      }
    }
    foilCtx.restore();

    foilCtx.strokeStyle = 'rgba(0,0,0,0.85)';
    foilCtx.lineWidth = 2.2 * this.dpr;
    foilCtx.strokeRect(well.x, well.y, well.w, well.h);
  }

  async _setPhotoFromCanvas(photoCanvas, depthCanvas) {
    this.photoSize = { w: photoCanvas.width, h: photoCanvas.height };
    this.uploadImageToTex(this.photoTex, photoCanvas);
    this.uploadImageToTex(this.depthTex, depthCanvas);
    this.hasPhoto = true;
    this.emptyEl.classList.add('hidden');
  }

  async _loadPhoto(src, depthSrc) {
    if (!src) return;
    const img = await loadImageFromUrl(src);
    const maxSide = 1280;
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const w = Math.max(2, Math.round(img.width * scale));
    const h = Math.max(2, Math.round(img.height * scale));
    const photoCanvas = document.createElement('canvas');
    photoCanvas.width = w;
    photoCanvas.height = h;
    photoCanvas.getContext('2d').drawImage(img, 0, 0, w, h);

    let depthCanvas;
    if (depthSrc) {
      const depthImg = await loadImageFromUrl(depthSrc);
      depthCanvas = drawCover(depthImg, w, h);
    } else {
      depthCanvas = makeFakeDepth(w, h);
    }
    await this._setPhotoFromCanvas(photoCanvas, depthCanvas);
  }

  async _readExternalManifest(src) {
    const resp = await fetch(src);
    if (!resp.ok) throw new Error(`${src}: HTTP ${resp.status}`);
    const html = await resp.text();
    // .prsm files are HTML documents — parse with DOMParser rather than
    // regex-scraping the manifest tag out, same reasoning as elsewhere in
    // this project: real markup (self-closing tags, odd whitespace/quoting)
    // breaks regex extraction in ways a real parser doesn't hit.
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const manifestEl = doc.getElementById('prsm-manifest');
    if (!manifestEl) throw new Error(`${src}: no #prsm-manifest found`);
    return JSON.parse(manifestEl.textContent);
  }

  async _readManifestAndStart() {
    const src = this.getAttribute('src');
    let manifest;
    if (src) {
      try {
        manifest = await this._readExternalManifest(src);
      } catch (err) {
        this.emptyEl.textContent = `Could not load ${src}`;
        console.warn(err);
        return;
      }
    } else {
      // data-manifest lets multiple cards share a page, each pointing at its
      // own manifest tag; falls back to the original fixed id so every
      // already-exported single-card .prsm file keeps working unchanged.
      const manifestId = this.getAttribute('data-manifest') || 'prsm-manifest';
      const manifestEl = document.getElementById(manifestId);
      if (!manifestEl) {
        this.emptyEl.textContent = `Missing #${manifestId}`;
        return;
      }
      try {
        manifest = JSON.parse(manifestEl.textContent);
      } catch (err) {
        this.emptyEl.textContent = 'Invalid manifest JSON';
        console.warn(err);
        return;
      }
    }

    this.params = manifestToParams(manifest);
    this.cardEl.style.setProperty('--rot-amt', this.params.rotAmt + 'deg');

    if (manifest.type === 'diorama') {
      const layers = (manifest.diorama?.layers || []).map((l) => ({
        src: l.src,
        depth: typeof l.depth === 'number' ? l.depth : 0,
        opacity: typeof l.opacity === 'number' ? l.opacity : 1,
      }));
      const { composite, depth, hasAny } = await buildDioramaComposite(layers);
      if (hasAny) {
        await this._setPhotoFromCanvas(composite, depth);
      } else if (manifest.photo?.src) {
        await this._loadPhoto(manifest.photo.src, manifest.photo.depth);
      }
    } else if (manifest.photo?.src) {
      await this._loadPhoto(manifest.photo.src, manifest.photo.depth);
    }

    this.resize();
    // guard against a second overlapping rAF loop if a src change re-runs
    // this after the loop from a previous load is already ticking
    if (!this._loopStarted) {
      this._loopStarted = true;
      this.animationLoop();
    }
    this._setupGyroPrompt();
  }

  _setupInput() {
    this.stage.addEventListener('pointermove', this._onPointerMove);
    this.stage.addEventListener('pointerleave', this._onPointerLeave);
    this.stage.addEventListener('touchmove', this._onTouchMove, { passive: false });
    this.stage.addEventListener('touchend', this._onTouchEnd);
    this.enableTiltBtn.addEventListener('click', () => this._requestGyro());
  }

  _setupGyroPrompt() {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      this.tiltOverlay.classList.add('show');
    } else if (DOE) {
      window.addEventListener('deviceorientation', this._boundOrientation);
    }
  }

  async _requestGyro() {
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return;
    if (typeof DOE.requestPermission === 'function') {
      try {
        const result = await DOE.requestPermission();
        if (result === 'granted') {
          window.addEventListener('deviceorientation', this._boundOrientation);
          this.tiltOverlay.classList.remove('show');
        }
      } catch (err) {
        console.warn('tilt permission blocked', err);
      }
    } else {
      window.addEventListener('deviceorientation', this._boundOrientation);
      this.tiltOverlay.classList.remove('show');
    }
  }

  handleOrientation(e) {
    if (e.gamma === null || e.beta === null) return;
    if (!this.baseline) this.baseline = { beta: e.beta, gamma: e.gamma };
    const scale = 30 / this.params.gyroSens;
    const gx = (e.gamma - this.baseline.gamma) / scale * (this.params.invertGyroX ? -1 : 1);
    const gy = (e.beta - this.baseline.beta) / scale * (this.params.invertGyroY ? -1 : 1);
    this.setTarget(gx, gy);
    if (!this.usingGyro) {
      this.usingGyro = true;
      this.tiltOverlay.classList.remove('show');
    }
  }

  animationLoop() {
    if (this.reducedMotion) {
      this.tilt.x = this.target.x;
      this.tilt.y = this.target.y;
    } else {
      this.tilt.x += (this.target.x - this.tilt.x) * 0.14;
      this.tilt.y += (this.target.y - this.tilt.y) * 0.14;
    }

    this.cardEl.style.setProperty('--tx', this.tilt.x.toFixed(3));
    this.cardEl.style.setProperty('--ty', this.tilt.y.toFixed(3));

    if (this.hasPhoto && this.params) {
      this.resize();
      let hx = this.tilt.x;
      let hy = this.tilt.y;
      if (this.params.wrapTilt) {
        hx = Math.sin(this.tilt.x * Math.PI);
        hy = Math.sin(this.tilt.y * Math.PI);
      }

      const gl = this.gl;
      const uni = this.uni;
      gl.useProgram(this.prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.photoTex);
      gl.uniform1i(uni.uPhoto, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, this.depthTex);
      gl.uniform1i(uni.uDepth, 1);
      gl.uniform2f(uni.uTilt, hx, -hy);
      gl.uniform1f(uni.uStrength, this.params.strength);
      gl.uniform1f(uni.uFocus, this.params.focus);
      gl.uniform1f(uni.uEdge, this.params.edge);
      gl.uniform1f(uni.uBlur, this.params.blur);
      gl.uniform1f(uni.uInvert, this.params.invertDepth ? 1 : 0);
      gl.uniform1f(uni.uShowDepth, 0);
      gl.uniform2f(uni.uTexel, 1 / Math.max(1, this.photoSize.w), 1 / Math.max(1, this.photoSize.h));
      gl.uniform1f(uni.uBrightness, this.params.brightness);
      gl.uniform1f(uni.uSaturation, this.params.saturation);
      gl.uniform1f(uni.uTintHue, this.params.tintHue);
      gl.uniform1f(uni.uTintAmount, this.params.tintAmount);
      gl.uniform1f(uni.uPhotoFoil, this.params.photoFoil ? 1 : 0);
      gl.uniform1f(uni.uFoilOpacity, this.params.foilOpacity);
      gl.uniform1f(uni.uFoilSparkle, this.params.foilSparkle);
      gl.uniform1f(uni.uFoilScale, mix(28, 10, (this.params.foilSize - 10) / 18));
      gl.uniform1f(uni.uFoilMono, this.params.foilStyle === 'mono' ? 1 : 0);
      gl.uniform1f(uni.uFoilHue, this.params.foilHue / 360);
      gl.uniform1f(uni.uFoilGrainAmt, this.params.foilGrain);
      gl.uniform1f(uni.uChromAb, this.params.chromAb);
      gl.uniform1f(uni.uVignette, this.params.vignette);
      gl.uniform1f(uni.uGrain, this.params.grain);
      gl.uniform1f(uni.uTime, performance.now() / 1000);
      gl.uniform1f(uni.uPhotoOpacity, this.params.photoOpacity);
      const facetIndex = { diamond: 0, hex: 1, prism: 2, flecks: 3 }[this.params.facetType] ?? 0;
      gl.uniform1f(uni.uFacetType, facetIndex);
      const cover = this.computeCoverScale();
      gl.uniform2f(uni.uCoverScale, cover[0], cover[1]);
      gl.drawArrays(gl.TRIANGLES, 0, 6);

      this.drawBorderFoil(this.tilt.x, this.tilt.y);
    }

    this._raf = requestAnimationFrame(() => this.animationLoop());
  }

  _teardown() {
    if (this._raf) cancelAnimationFrame(this._raf);
    this._loopStarted = false;
    window.removeEventListener('resize', this._boundResize);
    window.removeEventListener('deviceorientation', this._boundOrientation);
    if (this.stage) {
      this.stage.removeEventListener('pointermove', this._onPointerMove);
      this.stage.removeEventListener('pointerleave', this._onPointerLeave);
      this.stage.removeEventListener('touchmove', this._onTouchMove);
      this.stage.removeEventListener('touchend', this._onTouchEnd);
    }
  }
}

if (!customElements.get('prismatic-card')) {
  customElements.define('prismatic-card', PrismaticCard);
}

})();

</script></body>
</html>
